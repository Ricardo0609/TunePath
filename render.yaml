services:
  - type: web
    name: waveset
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SPOTIFY_CLIENT_ID
        sync: false
      - key: VITE_REDIRECT_URI
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
